name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    # workflow_runはSecretを使える状態で動くため、フォークからのPRのコードをビルドさせない
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop')))
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["production"]' || github.event.workflow_run.event == 'pull_request' && '["preview"]' || '["development","staging"]') }}
    concurrency:
      group: cloudflare-pages-${{ matrix.environment == 'preview' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || matrix.environment }}
      cancel-in-progress: true
    name: Deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    env:
      VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}

    steps:
      - name: Set deploy target
        id: target
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          case "$ENVIRONMENT" in
            production)
              echo "pages_branch=main" >> "$GITHUB_OUTPUT"
              echo "verify_url=https://recwatch.pages.dev" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "pages_branch=staging" >> "$GITHUB_OUTPUT"
              echo "verify_url=https://staging.recwatch.pages.dev" >> "$GITHUB_OUTPUT"
              ;;
            development)
              echo "pages_branch=develop" >> "$GITHUB_OUTPUT"
              echo "verify_url=https://develop.recwatch.pages.dev" >> "$GITHUB_OUTPUT"
              ;;
            preview)
              if [ -z "$PR_NUMBER" ]; then
                echo "::error::workflow_runイベントからPR番号を取得できませんでした"
                exit 1
              fi
              echo "pages_branch=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "verify_url=https://pr-${PR_NUMBER}.recwatch.pages.dev" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/client --project-name=recwatch
            --branch=${{ steps.target.outputs.pages_branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview URL on PR
        if: matrix.environment == 'preview'
        uses: actions/github-script@v9
        env:
          PAGES_BRANCH: ${{ steps.target.outputs.pages_branch }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        with:
          script: |
            const branch = process.env.PAGES_BRANCH;
            const url = `https://${branch}.recwatch.pages.dev`;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = "<!-- recwatch-preview-url -->";
            const body = [
              marker,
              `🚀 Preview: ${url}`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Verify deployed legal pages
        env:
          LEGAL_BASE_URL: ${{ steps.target.outputs.verify_url }}
        # develop未取り込みの既存PRには検証scriptがないため、存在する場合のみ実行する。
        run: npm run verify:legal:http --if-present
